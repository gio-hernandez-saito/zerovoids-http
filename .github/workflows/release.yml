name: Release

# On push to main, Changesets opens/updates a "Version Packages" PR; merging that
# PR (which consumes the changesets and bumps versions) publishes to npm. With no
# changesets present, this is a no-op.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # never interrupt an in-flight publish

permissions:
  contents: write # push the version commit / tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # Publishing is intentionally deferred until the first release: add
      #   publish: pnpm changeset publish
      # back (with NPM_CONFIG_PROVENANCE: true in env) once the npm OIDC trusted
      # publisher is registered for this repo. Until then this only opens the
      # "Version Packages" PR — it never attempts to publish 0.0.0.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
