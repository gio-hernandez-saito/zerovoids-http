name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset status compares against origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & format
        run: pnpm biome ci .
      - name: Typecheck
        run: pnpm turbo typecheck
      - name: Build (attw + publint)
        run: pnpm turbo build
      - name: Bundle size
        run: pnpm turbo size
      - name: Dead code / deps
        run: pnpm knip
      # Changeset enforcement (`changeset status --since=origin/main`) is deferred
      # until the first release: pre-1.0 the package is unpublished and publishing
      # is off, so requiring a releasing changeset on every packages/* change (even
      # tooling like vitest.config.ts) is premature. Re-add it at the first 0.2.0 release.

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zerovoids/http-core test:coverage
      - name: Upload coverage to Codecov
        if: ${{ matrix.node == 24 }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: gio-hernandez-saito/zerovoids-http
          fail_ci_if_error: false

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            chore
            ci
            build
            revert
          scopes: |
            core
            deps
            repo
            release
            ci
          requireScope: false
